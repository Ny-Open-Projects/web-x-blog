<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" font-family="system-ui,sans-serif">
<rect width="560" height="320" rx="12" fill="#0F172A"/>
<text x="280" y="34" text-anchor="middle" fill="#E2E8F0" font-size="17" font-weight="600">并发 · 异步任务时序（完成顺序 ≠ 启动顺序，自动循环播放）</text>
<g style="animation: st0 7.2s linear infinite both">
<text x="96" y="99" text-anchor="end" fill="#94A3B8" font-size="13" font-weight="600">taskA</text>
