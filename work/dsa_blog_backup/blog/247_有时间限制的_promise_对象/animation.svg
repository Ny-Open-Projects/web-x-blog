<style>
.st0 {opacity:0} @keyframes st0 {0%{opacity:0}0.00%{opacity:0}3.00%{opacity:1}22.00%{opacity:1}25.00%{opacity:0}100%{opacity:0}}
.st1 {opacity:0} @keyframes st1 {0%{opacity:0}25.00%{opacity:0}28.00%{opacity:1}47.00%{opacity:1}50.00%{opacity:0}100%{opacity:0}}
