<line x1="447.5" y1="66" x2="447.5" y2="230" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
<line x1="222.5" y1="66" x2="222.5" y2="230" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
