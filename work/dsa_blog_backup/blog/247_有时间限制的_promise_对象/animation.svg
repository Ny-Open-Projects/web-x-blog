<text x="280" y="268" text-anchor="middle" fill="#34D399" font-size="14" font-weight="700">完成顺序：（等待中…）</text>
<text x="280" y="292" text-anchor="middle" fill="#94A3B8" font-size="13">t=0ms：三个任务并发启动</text>
</g>
<g style="animation: st1 7.2s linear infinite both">
