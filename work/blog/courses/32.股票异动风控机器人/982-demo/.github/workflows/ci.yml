name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & Test (offline mock profile, no API key needed)
        # 注：-Dspring-boot.run.profiles 只作用于 spring-boot:run goal，对 verify 无效，
        # 真正的启动装配由 RiskBotApplicationTest / RiskBotProdProfileTest 两个上下文测试守护
        run: mvn -B verify
      - name: Package
        run: mvn -B -DskipTests package
      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t risk-bot:${GITHUB_SHA::7} .
