version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: lowcode
      MYSQL_USER: lowcode
      MYSQL_PASSWORD: change_me
    ports: ['3306:3306']
    volumes: ['mysql_data:/var/lib/mysql']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    depends_on: [mysql, redis]
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: lowcode
      DB_PASSWORD: change_me
      DB_DATABASE: lowcode
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports: ['3000:3000']

volumes:
  mysql_data:
