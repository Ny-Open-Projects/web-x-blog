<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2329; --sub:#5b6573; --line:#e3e8ef;
  --brand:#2f6fed; --brand2:#0aa; --soft:#eef3ff; --code:#f3f4f6; --ok:#1a7f37;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.layout{display:flex;min-height:100vh}
.side{width:248px;background:#0f1b2d;color:#cdd6e4;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:15px;margin:0 16px 4px;color:#fff;letter-spacing:.5px}
.side .tag{font-size:11px;color:#7e8aa0;margin:0 16px 16px}
.nav a{display:block;padding:9px 18px;color:#cdd6e4;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.nav a:hover{background:#16263c;color:#fff}
.nav a.active{background:#16263c;color:#fff;border-left-color:var(--brand)}
.main{flex:1;padding:26px 34px;max-width:1080px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:22px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
h2.sec{margin-top:0;font-size:22px}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px}
.kpi{background:var(--soft);border:1px solid #dbe6ff;border-radius:10px;padding:12px 18px;min-width:120px}
.kpi b{display:block;font-size:24px;color:var(--brand)}
.kpi span{font-size:12px;color:var(--sub)}
.controls{display:flex;gap:10px;margin:6px 0 16px;flex-wrap:wrap;align-items:center}
.controls input,.controls select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.controls input{flex:1;min-width:220px}
.btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.btn.ghost{background:#eef1f6;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f0f4fa;color:var(--sub);font-weight:600}
tr:nth-child(even) td{background:#fafbfc}
a.doc{color:var(--brand);text-decoration:none}
a.doc:hover{text-decoration:underline}
.pill{display:inline-block;background:#eef3ff;color:var(--brand);border-radius:999px;padding:1px 9px;font-size:12px;margin-right:4px}
h1,h2,h3,h4{line-height:1.3}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:#0f1b2d;color:#e6edf6;padding:14px 16px;border-radius:10px;overflow:auto;font-size:13px}
pre code{background:none;color:inherit;padding:0}
blockquote{border-left:4px solid var(--brand);background:#f6f9ff;margin:10px 0;padding:8px 14px;color:var(--sub)}
.md-body ul,.md-body ol{padding-left:22px}
.md-body li{margin:3px 0}
.stage-h{font-size:18px;margin:18px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.hidden{display:none}
.meta-note{font-size:12px;color:var(--sub);margin-bottom:10px}
</style>

const META = {"00": "# 低代码平台工程实践 · 总览与定位\n\n> 本文档是「小滴课堂 全栈多端低代码平台项目大课」知识资产的**顶层定位文件**，界定这批内容的服务对象、能力边界，以及它与 229 篇博客、知识图谱、本套工程实践文档之间的关系。\n\n## 一、资产从哪来\n\n| 资产 | 规模 | 说明 |\n|------|------|------|\n| 视频转写技术博客 | **229 篇 / 约 55.2 万字** | 覆盖 9 个期（预先课 40 + 第一至八期 189），六段式结构（导语/前置/正文/小结/下一步） |\n| 知识图谱 `graph.json` | **229 节点** | 每节点含 `stage`/`subdir`/`title`/`num`/`materials`/`containers`，关联 17146 个外部物料（代码/文档/图片） |\n| 关联物料 | **17146 个文件**，100% 已挂接 | 代码 13724、图片 1102、数据配置 1323 等 |\n| 工程实践补充文档 | 本套（总览/原理×2/治理/导航/手册） | 弥合方法论缺口、固化治理、结构化知识 |\n\n> 说明：`graph.json` 经终检全程未改动（sha256 `7af90b42…`），229 篇博客已通过六点校验与转写痕迹终检，是可信的内容底座。本套工程实践文档是在该底座之上**叠加**的方法论与治理层，不修改、不重命名既有 229 篇。\n\n## 二、定位：它是谁、不是谁（明确边界）\n\n这批内容来自一套**讲\"如何自研一套低代码平台\"的全链路代码级实战课**。因此它的定位必须清晰：\n\n### ✅ 它适合做（研发侧资产）\n\n- **自研低代码平台的技术底座**：从需求分析 → 系统架构 → 后端（NestJS）→ 前端（React/Next.js）→ 组件拖拽与配置 → 发布页 Schema 渲染 → OSS 资源 → 压测运维，全链路可复现。\n- **研发团队 onboarding 教材**：新人跟着做一遍，即掌握一套现代全栈低代码平台的搭建链路。\n- **内部技术踩坑 / 复盘库**：实战细节丰富，错误处理、联调踩坑、Docker/DevOps 配置详尽。\n\n### ❌ 它不适合做（边界）\n\n- **不用于对外平台选型决策**：缺少平台横向对比、能力矩阵、ROI 分析。\n- **不用于售前 / 方案材料**：缺少业务价值抽象、方法论包装、客户视角叙事。\n- **不面向公民开发者（业务侧）自助搭建**：课程面向研发，不讲解零代码边界与业务配置范式。\n\n> 一句话：**这是「研发侧的自研实战资产」，不是「选型/售前/零代码」材料。**\n\n## 三、低代码 vs 零代码 边界（必须区分）\n\n| 维度 | 低代码（本资产所属） | 零代码 |\n|------|----------------------|--------|\n| 是否需要研发介入 | **需要**（写组件、接接口、改渲染器） | 不需要（纯配置） |\n| 灵活度 | 高，可深度定制与集成 | 受限，受平台能力边界约束 |\n| 适用人群 | 研发 / 全栈工程师 | 业务运营 / 产品经理 |\n| 典型产物 | 本平台（拖拽编辑器 + 自研渲染器 + 后端） | 表单工厂、轻流、简道云类 |\n| 何时选 | 业务差异化强、需深度集成、长期演进 | 标准化后台、快速交付、人力有限 |\n\n若业务侧确有\"公民开发者自助搭建\"诉求，应**另起一套零代码材料**，并与本资产在边界上明确区分，避免读者混淆\"配置即所得\"与\"研发介入才能扩展\"两种范式。\n\n## 四、本套工程实践文档清单\n\n| 文件 | 对应建议 | 作用 |\n|------|----------|------|\n| `工程实践-00-总览与定位.md` | 4.1 定边界 | 本文：明确服务对象与边界 |\n| `工程实践-01-原理综述（上）-Schema与DSL驱动渲染.md` | 4.2 补能力 | 升华\"为什么拖一下就能生成页面\" |\n| `工程实践-02-原理综述（下）-引擎权限与边界.md` | 4.2 补能力 | 表单/流程引擎、RBAC 多端、低代码vs零代码、自研vs采购 |\n| `工程实践-03-内容治理规范.md` | 4.3 立规矩 | 门禁 + 术语表 + 双人复核 + 密钥安全 |\n| `工程实践-04-生命周期导航.md` | 4.4 结构化 | 按落地生命周期把 229 篇归类 |\n| `低代码平台工程实践手册.md` | 落地 | 可商用 playbook：技术栈/架构/关键模式/Do·Don't/上线清单 |\n| `工程实践门户.html` | 落地 | 自包含可打开的工程实践门户（读知识图谱，检索 229 篇） |\n\n## 五、如何使用这套资产\n\n1. **新人 onboarding**：先看本总览 → 读原理综述（上/下）→ 按生命周期导航从「需求分析」顺着学到「压测运维」。\n2. **查具体实现**：用门户检索关键词（如 `dnd-kit`、`TypeORM`、`OSS`、`Dockerfile`），直达对应博客。\n3. **做技术决策**：参考原理综述（下）的「自研 vs 采购决策树」与工程实践手册的架构决策。\n4. **内容续写 / 复用**：严守 `工程实践-03-内容治理规范.md` 的门禁与术语表，延续关联物料注入机制。\n", "01": "# 低代码平台技术原理综述（上）：Schema / DSL 如何驱动页面渲染\n\n> 视角：低代码平台落地专家。\n> 目的：课程 229 篇把\"低代码平台\"从需求到上线**一行行代码敲了出来**，却很少点破一件事——**为什么在编辑器里拖一下、配几个属性，发布出去就是一个能跑的页面？** 答案就四个字：**Schema 驱动**。本文把课程里\"做出来\"的部分，升华到\"为什么成立\"，并全部用课程真实篇目作样本。\n\n## 一、核心命题：低代码 ≠ 少写代码，而是\"配置即 UI\"\n\n普通 CRUD 系统：每个页面都是手写的 `.tsx` / `.vue`，改一个字段要改代码、改构建、发版本。\n低代码平台：页面**不是被写出来的，而是被描述出来的**——用一份\"描述页面长什么样、有哪些组件、每个组件什么属性\"的数据（Schema），交给一个**通用的渲染器**解释执行。\n\n> 这份\"描述数据\"就是 Schema；把 Schema 表达成更紧凑、带逻辑语法的形态，就是 DSL（领域特定语言）。\n\n课程的发布页渲染，就是一份教科书级的 Schema 驱动样本。\n\n## 二、活样本：发布页渲染（呼应《低代码项目发布页面—获取页面渲染》20-6）\n\n`20-6` 里，发布页拿到后端返回后，核心逻辑是：\n\n```ts\n// 后端返回的数据（这正是 Schema 本体）\n// 每个组件含：id、type、props(options)\n// 例：{ id, type:'input', props:{ text:'请输入姓名' } }\n\nlocalData.components.map(item =>\n  getComponentByType(item.type)   // type → 组件 的映射\n);\n// 用扩展运算符把 props 摊开到组件标签上：<Comp {...props} />\n// 输入型组件通过 onChange→onUpdate 回写 localData\n```\n\n拆解成 Schema 驱动的四个要素：\n\n| 要素 | 课程里的对应 | 说明 |\n|------|--------------|------|\n| **Schema（数据）** | `{id, type, options}` 组件数组 | 描述\"有哪些组件、各自什么属性\" |\n| **渲染器（Runtime）** | `ComponentRender` + `getComponentByType(type)` | 通用解释器，按 type 选组件、摊开 props |\n| **组件注册表** | `share` 公共包里的 `getComponentByType` | type 与组件的映射表，新增组件即登记 |\n| **数据回写** | `onChange→onUpdate→useImmer setLocalData` | 视图输入与 Schema 保持同步 |\n\n**一句话**：编辑器里\"配出来的页面\"，发布后就是这份 Schema；发布页不过是一个**读 Schema、映射组件、摊开属性**的通用渲染器。这就是低代码的本质。\n\n## 三、更深一层：编辑器编辑的其实是\"数据\"，不是\"画面\"\n\n看《低代码项目平台编辑模块—页面组件拖拽排序功能开发》（18-4），拖拽排序的本质是：\n\n```ts\n// 拖拽 = 数组里两个索引的位置交换\nconst moveComponent = (oldIndex, newIndex) => {\n  runInAction(() => {\n    store.components = arrayMove(store.components, oldIndex, newIndex);\n  });\n};\n```\n\n课程自己总结了关键一句：**「所有拖拽动作，最终都被转换成数组里两个索引的位置交换，视图只是这份数组的投影。」**\n\n这正是 Schema 思维的延伸：\n- 画布上的组件列表 = Schema 数组的**投影**；\n- 拖拽、键盘上下移、删除、复制粘贴 = 对数组做**增删改**；\n- 发布 = 把这份数组（Schema）写库；\n- 渲染 = 把数组读出来再投影一次。\n\n所以\"编辑器\"和\"发布页\"共享同一份数据契约，只是**一个可写、一个只读**——这正是《低代码项目发布页面—后端接口低代码组件获取》（20-2）里\"编辑端按 `user` 查、发布页按 `pageId` 查、复用同一服务层\"的设计动机。\n\n## 四、升华：Schema 与 DSL 的关系\n\n| 概念 | 形态 | 角色 | 课程对应 |\n|------|------|------|----------|\n| **Schema** | JSON 数据（结构化描述） | 运行时被渲染器**解释执行** | `{id,type,options}` 组件数组 |\n| **DSL** | 专用语言 / 配置语法 | 经**编译/解释**生成 Schema 或代码 | 本课程用 JSON Schema 直驱（未另起 DSL） |\n\n**什么时候需要 DSL？**\n当配置维度超出\"表单填属性\"的承载能力时——例如：\n- 组件间的**条件显隐**（A 选\"是\"才显示 B）；\n- **跨页面 / 跨数据源联动**；\n- **循环、分支、表达式**。\n\n这时用纯 JSON 表单去配会非常笨重，改用一段 DSL（或可视化逻辑编排）表达更简洁，再编译成 Schema 交给渲染器。本课程把\"条件/逻辑\"固化进了组件 props（`input`/`radio`/`checkbox` 的 `defaultXxx` 与 `onUpdate` 映射，见 20-6），属于\"用 Schema 直接承载简单逻辑\"的轻量路线，够用但**扩展性有限**——这正是商用化时需要补 DSL/逻辑编排层的地方。\n\n**业界对照（便于建立坐标系）**：\n\n| 平台 | 驱动方式 |\n|------|----------|\n| 阿里 LowCodeEngine | 协议式 Schema（assets 协议 + schema 协议） |\n| 百度 Amis | JSON Schema 直驱渲染 |\n| Retool | 数据绑定 DSL |\n\n## 五、给自研者的落地铁律\n\n1. **必须先固化 Schema 协议**：组件 `type` 枚举、每个 `type` 的 `props` 规范、Schema 版本号。否则组件一多、属性一乱，渲染器无从维护——课程 `getComponentByType` 的**注册表模式**是最小可行起点。\n2. **编辑器与渲染器共享契约**：同一份 Schema，编辑端可写、发布端只读。不要为两端各写一套数据结构（课程的\"复用同一服务层\"已体现该原则）。\n3. **把 UI 当作数据的投影**：任何\"画布上的操作\"（拖拽、排序、删除）都先想清楚\"它改的是数组里的哪一段\"，再谈视图。\n4. **预留 DSL / 逻辑层接口**：哪怕当前只用 JSON 直驱，也要在 Schema 里留出\"逻辑表达式\"字段，避免将来推倒重来。\n\n> 下篇（原理综述·下）继续讲：表单引擎 / 流程引擎的职责、RBAC 在多端的落地、低代码 vs 零代码边界、以及自研 vs 采购的决策。\n", "02": "# 低代码平台技术原理综述（下）：引擎、权限与边界\n\n> 视角：低代码平台落地专家。\n> 承接（上）篇的 Schema 驱动内核，本篇补齐方法论层的另外三块拼图：**表单/流程引擎的职责**、**RBAC 在多端的落地**、以及**低代码 vs 零代码 / 自研 vs 采购的边界决策**。全部以课程真实篇目为锚点。\n\n## 一、表单引擎 / 流程引擎：课程里已经有了雏形\n\n课程没有直接喊\"表单引擎\"\"流程引擎\"这些词，但它把这两类引擎的**核心机制**都做出来了——只是散落在实现里，需要点破。\n\n### 1.1 表单 / 页面引擎（雏形已在）\n\n课程的\"组件拖拽 + 属性配置 + Schema 渲染\"链路，本质就是**表单/页面引擎的最小可行实现**：\n\n- **组件注册表**：`share` 公共包 `getComponentByType`（见《低代码项目发布页面—获取页面渲染》20-6）；\n- **属性面板 Schema**：每个组件有\"展示视图 + 配置属性\"成对开发（14-x 系列：视频/图片/轮播/卡片/文本/富文本/二维码/警告/问卷输入等组件，均有「展示视图」与「配置属性」两篇）；\n- **数据回写**：`onChange→onUpdate` 把视图输入写回 Schema（20-6）；\n- **拖拽编排**：dnd-kit 数组重排（18-4）。\n\n> 这四点合起来，就是一个**无代码表单/页面引擎**：拖组件 → 配属性 → 存 Schema → 渲染。商用化时，只需把\"组件列表\"抽象成可插拔的**组件市场**、把\"属性配置\"抽象成**引擎配置协议**即可。\n\n### 1.2 流程引擎（课程未做，需补齐）\n\n流程引擎负责\"**业务如何流转**\"：审批流、状态机、定时触发等。课程里**只有状态与动作的雏形**，没有真正的流程引擎：\n\n- 发布页有「草稿 / 预览 / 发布」三态（19-2 草稿、19-3 预览、19-4 发布）；\n- 问卷有「提交 / 是否提交过」状态（20-3、20-4）。\n\n但\"审批流、会签、条件分支流转\"并未涉及。**落地建议**：若业务需要审批流，引入 BPMN 或轻量状态机，**与表单引擎解耦**——表单引擎产出数据，流程引擎决定数据怎么流转，二者通过事件/接口协作，不要揉成一团。\n\n## 二、权限模型：RBAC 在多端的落地\n\n课程在《放长线钓大鱼—规划低代码平台的系统架构》（6-2）里明确了平台三端：\n\n| 端 | 角色 | 鉴权要求 |\n|----|------|----------|\n| 后台编辑端 | 编辑 / 管理员 | **需登录**：token 解析 `user` |\n| 发布页 H5 | 访客 | **不鉴权**：凭 `pageId` 取数 |\n| 后台数据统计 | 管理员 | 需登录 + 数据权限 |\n\n这套\"同一份数据，不同端不同可见性\"，正是 **RBAC（角色-权限-资源）** 思想的体现。课程里已埋下关键零件：\n\n- **用户身份提取**：《低代码项目后端接口开发—获取用户信息装饰器配置》（11-1）用装饰器从 token 解析 `user`，全局复用；\n- **发布接口鉴权**：《后端接口开发—低代码项目编辑模块发布接口《上》》（14-2）处理\"谁能发布\"的权限判断；\n- **访客免登录**：《低代码项目发布页面—后端接口低代码组件获取》（20-2）发布页接口不鉴权、用 `user?.id` 可选链兜底。\n\n**RBAC 落地建议（商用化）**：\n\n```\n角色(管理员 / 编辑 / 访客) × 资源(页面 / 组件 / 问卷数据) × 操作(读 / 写 / 发布)\n```\n\n- 用 **NestJS Guard + 装饰器**（呼应 11-1 的用户信息装饰器）做统一鉴权，不要在 Controller 里散写 `if (!user)`；\n- 数据权限（谁能看哪些问卷数据）单独一层，不要和菜单权限混用；\n- 前端路由级 + 接口级双重拦截，避免\"前端藏按钮、接口仍裸奔\"。\n\n## 三、低代码 vs 零代码：边界到底在哪\n\n| 维度 | 低代码 | 零代码 |\n|------|--------|--------|\n| 研发介入 | 必须（写组件/接接口/改渲染器） | 不需要 |\n| 灵活度 | 高，可深度定制与系统集成 | 受限，受平台能力边界约束 |\n| 适用人群 | 研发 / 全栈工程师 | 业务运营 / 产品 |\n| 典型代表 | 本平台、LowCodeEngine、Retool | 简道云、轻流、表单工厂 |\n| 何时选 | 业务差异化、需集成、长期演进 | 标准化后台、快速交付 |\n\n**关键判断**：如果\"业务方想自己拖一个页面、且永远不需要研发改代码\"，那是零代码场景，本资产**不适用**，应另起零代码材料。如果\"页面要和公司既有系统深度打通、要有自研组件和接口\"，那就是低代码，本平台路线正确。\n\n## 四、自研 vs 采购：决策树（ROI 视角）\n\n```\n业务是否高度差异化 / 需深度系统集成 / 要长期自主演进？\n├─ 是 → 自研低代码平台（本平台路线）\n│       前期成本高，但长期可控、不与供应商锁定\n└─ 否 → 采购 / 接入成熟方案\n         ├─ 要\"JSON 配置出页面\" → 阿里 LowCodeEngine / Amis\n         ├─ 要\"数据后台 + 流程\" → 商用 aPaaS（简道云 / 轻流类）\n         └─ 标准化管理后台 → 直接上 Admin 框架，别造轮子\n```\n\n**ROI 提示**：自研的真正价值不在\"省了多少写页面时间\"，而在**业务差异化能力被沉淀成可复用资产**。若只是做几个标准化后台，采购远比自研划算。\n\n## 五、本资产的方法论缺口与补齐清单\n\n| 缺口（课程缺） | 是否在本套文档补齐 | 落点 |\n|------|------|------|\n| 低代码引擎概念 | ✅ 已综述 | 原理综述（上） |\n| 表单/流程引擎职责 | ✅ 已综述 | 本篇 一 |\n| Schema/DSL 驱动 | ✅ 已综述 | 原理综述（上） |\n| RBAC 多端落地 | ✅ 已综述 | 本篇 二 |\n| 低代码 vs 零代码 | ✅ 已综述 | 本篇 三 |\n| 自研 vs 采购 | ✅ 已综述 | 本篇 四 |\n| **组件市场 / 协议版本化** | ⚠️ 仅建议 | 工程实践手册\"商用化补齐清单\" |\n| **逻辑编排 / DSL 层** | ⚠️ 仅建议 | 原理综述（上）四 |\n| **监控告警 / 灰度发布** | ⚠️ 仅建议 | 工程实践手册\"上线 checklist\"延伸 |\n\n> 结论：229 篇是**优秀的低代码（自研）全链路实现样本**；补完上文的方法论层与商用化清单后，即可作为团队自研低代码平台的**可信技术底座**。\n", "03": "# 低代码平台工程实践 · 内容治理规范\n\n> 目的：把 229 篇博客在审核中验证有效的\"内容门禁、术语统一、准确性复核、密钥安全\"机制**固化为可执行的规范**，供后续内容续写、复用、移交时照章执行。本文对应落地建议 4.3。\n\n## 一、内容门禁（硬约束，违反即打回）\n\n以下任一项出现，视为不合格，必须在交付前清除：\n\n| # | 禁项 | 说明 / 识别特征 | 处理方式 |\n|---|------|----------------|----------|\n| 1 | 转写处理痕迹 | 形如 `（视频口播误读为 X）`、`（口播里提到 X）`、`（视频中口播误读为 X）` 的纠错括号 | 删除紧跟正确术语后的纠错括号；保留有价值的解释性正文 |\n| 2 | 口播语气词 | \"视频里\"\"听起来\"\"专题视频里\"\"讲师讲到\"等把读者当观众的表述 | 书面化收紧为客观技术叙述 |\n| 3 | 广告后缀 | 任何位置的 `【网盘分享wpfx.org.cn】` | 全局删除（文件名中的后缀属历史遗留，正文不得出现） |\n| 4 | HTML 实体 | `&ldquo;` `&rdquo;` `&amp;` `&quot;` `&middot;` 等 | 还原为 `\"` `\"` `&` `\"` `·` |\n| 5 | 编造互链 | 「下一步/前置知识」引用了标题白名单（《titles.txt》229 条）之外不存在的篇目 | 仅引用真实存在的标题，句式用「建议接着看《X 标题》」 |\n| 6 | 结构缺失 | 六段（导语/前置知识/正文/小结/下一步）任一段缺失 | 补全，章节/课程末尾写明「本课程告一段落」 |\n\n**终检脚本**（已验证可用，见 `tools/verify_xiaodi_6point.py`）：对全量博客跑六点校验——落盘完整性、六段结构、广告/实体残留、互链真实性、转写痕迹残留、篇幅。终检全绿方可交付。\n\n## 二、全文术语表（统一用词，避免一词多写）\n\n### 2.1 中文核心术语（全文一致）\n\n| 术语 | 写法 | 易错写法 |\n|------|------|----------|\n| 低代码 | 低代码（可附 low-code） | 低码、LowCode（混用） |\n| 零代码 | 零代码 | 无代码（除非引述原文） |\n| 表单引擎 | 表单引擎 | 表单引擎器 |\n| 流程引擎 | 流程引擎 | — |\n| Schema | 保留英文 Schema | 不翻译为\"模式\" |\n| DSL | 保留英文 DSL | — |\n| RBAC | 保留英文 RBAC | — |\n| 拖拽 | 拖拽 | 拖动（口语） |\n| 组件库 | 组件库 | — |\n\n### 2.2 英文专有名词大小写（严格对齐代码）\n\n| 正确 | 常见误写 |\n|------|----------|\n| React / React Native | react、REACT |\n| Next.js / Nuxt / Nuxt.js | nextjs、NUXT |\n| NestJS | nestjs、NestJs、NESTJS |\n| TypeScript / JavaScript | typescript |\n| TypeORM / Prisma | typeorm |\n| Ant Design（非 antd 正文） | ant design |\n| Tailwind CSS | tailwindcss |\n| Redux / MobX | redux、mobx（代码内可小写，正文用规范名） |\n| Vite / Webpack | — |\n| JWT / RBAC / ORM | — |\n| pnpm / Monorepo / workspace | — |\n| MySQL / Redis / Nginx | mysql、redis |\n| 阿里云 OSS / ECS / CDN / 云效 | oss、ecs |\n| dnd-kit（含 @dnd-kit/core、@dnd-kit/sortable） | dndkit |\n\n> 英文术语在**正文叙述**中用规范大小写；在**代码块/配置**中按语言/库本身的写法（如 `antd`、`mobx` 依赖名小写属正常）。\n\n## 三、技术准确性双人复核\n\n涉及以下高敏感信息时，**以关联代码（materials）为准，不允许凭口播记忆**：\n\n1. **接口名 / 路由**：对照 `graph.json` 中该篇的 `materials.data` 关联代码路径（如 `代码（已8期）/.../14-6/lowcode/packages/client/package.json`）；\n2. **类名 / 装饰器**：如 `AliOssModule`、`@Global()`、`useSortable`、`arrayMove` 等，须能在关联工程中找到；\n3. **版本号**：依赖版本以 `package.json` 片段为准（如 `antd ^5.11.2`、`@dnd-kit/core ^6.1.0`、`react-router-dom ^6.20.1`）；\n4. **数字 / 配置项**：端口、地域（`oss-cn-guangzhou`）、Bucket 名等，以代码与配置为准。\n\n**复核机制**：作者自校（跑六点终检）→ 第二人对照 `materials` 抽验关键接口/类名/版本 → 双方签字（或 PR review 记录）后方可并入主文档集。课程已建立\"关联物料注入机制\"（每篇博客带 `materials` 字段），**该机制必须延续**，不得退化成纯口播改写。\n\n## 四、版本与密钥安全规范（生产红线）\n\n课程在《低代码项目平台编辑模块—阿里云 OSS 资源上传配置》（17-1）中已用**占位符**填写密钥，并提示：\n\n> `accessKeyId: '你的AccessKeyId'`、`accessKeySecret: '你的AccessKeySecret'`；secret 仅在阿里云控制台创建时展示一次，之后无法再查，只能重建。\n\n《项目自动化部署上线—线上前端项目编辑平台功能确认》（27-7）同样触及线上密钥配置。**这是教学占位，绝不可直接用于生产。** 落地部署须遵守：\n\n1. **禁止硬编码密钥**：`config.ts` / `.env` 中的 `accessKeySecret`、`数据库密码`、`JWT 私钥` 等一律通过**环境变量或密钥管理服务**（如云效密钥库、KMS、Vault）注入，不入库、不进镜像层。\n2. **最小权限**：OSS AccessKey 仅授予所需 Bucket 的 `Put/Get/Delete`，不开 `*` 全量；数据库账号按需建库建表权限。\n3. **安全评审**：任何密钥变更、域名绑定（如 27-6 Bucket 绑定域名）、公网暴露前，走安全评审。\n4. **密钥轮换**：AccessKey 定期轮换，离职/交接即废。\n5. **不要把课程占位符当真实配置**：`local-is`、`16web.net`、`oss-cn-guangzhou` 等均为讲师演示值，生产替换为自有资源。\n\n### 安全自查清单（上线前逐条确认）\n\n- [ ] 全仓 `grep` 无明文 `accessKeySecret` / 密码 / 私钥\n- [ ] 所有密钥来自环境变量 / 密钥管理服务\n- [ ] AccessKey 权限已收敛至最小\n- [ ] 公网暴露的接口已做鉴权（编辑端需登录，发布页仅凭 `pageId` 且不含敏感数据）\n- [ ] 密钥轮换与交接流程已文档化\n- [ ] 数据库、Redis、OSS 均已开启访问白名单 / VPC 隔离\n", "05": "# 低代码平台 · 工程实践手册（Playbook）\n\n> 用途：把 229 篇博客 + 知识图谱 `graph.json` 提炼成**可直接照做的工程实践手册**——技术栈、架构决策、关键代码模式、Do/Don't、上线 checklist、商用化补齐。供研发团队自研低代码平台时按图索骥。对应落地建议「基于知识图谱落地可商用工程实践」。\n\n## 一、技术栈总表（从各期 `package.json` 提炼）\n\n| 层 | 选型 | 课程落点 |\n|----|------|----------|\n| 工程组织 | **pnpm-workspace Monorepo** | 8-1 深度解析 pnpm-workspace；8-2~8-6 初始化 client/server/share |\n| 前端框架 | **React 18 + Vite + TypeScript** | 8-3 前端子项目 React；14-6 编辑器布局 |\n| 服务端渲染 | **Next.js**（发布页） | 3-1~3-6 Next.js 初始化与路由；20-5 发布页初始化 |\n| UI 组件库 | **Ant Design 5** | 9-4 React 项目配置 Antd+Tailwind；14-6 Tabs |\n| 样式 | **Tailwind CSS 3** | 9-4；14-6 Flex 布局 |\n| 状态管理 | **MobX**（编辑器）、自定义 hooks | 13-2 公共状态管理；18-4 `runInAction`+`arrayMove` |\n| 拖拽 | **dnd-kit**（core/sortable/utilities） | 18-4 拖拽排序 |\n| 后端框架 | **NestJS**（Node.js） | 8-4 后端子项目；9-2/9-3 配置 |\n| ORM | **TypeORM + MySQL** | 10-2~10-8 实体/关系/事务；9-2 后端配置 |\n| 缓存 | **Redis** | 11-2 加密+Redis 模块 |\n| 对象存储 | **阿里云 OSS** | 17-1~17-5 上传/删除/获取 |\n| 网关 | **Nginx**（反向代理 + 负载均衡） | 6-2 架构；23-4/23-6 Nginx 镜像 |\n| 容器化 | **Docker + Docker Compose** | 23-x 多 Dockerfile；24-1/24-2 Compose |\n| DevOps | **云效 Codeup + 流水线** | 9-1 代码管理；25-1 流水线；26-x 多镜像运行 |\n| 压测 | **Jmeter 5** | 28-x 安装/组件；30-x 接口压测 |\n| 验证码 | 图形验证码 + 短信验证码 | 11-3 图形；11-4/11-5 短信；11-6 手机 |\n\n## 二、架构决策（引用《放长线钓大鱼—规划低代码平台的系统架构》6-2）\n\n```\n访问层      后台编辑端(含数据统计 ECharts)  +  发布页 H5\n   │\nNginx 网关  反向代理 + 高并发负载均衡(多节点)\n   │\n后端服务    NestJS（编辑/发布/问卷/微信登录 等模块）\n   │\n存储层      MySQL(主业务)  +  Redis(缓存)  +  OSS(静态资源/CDN)\n   │\n基础设施    ECS  +  域名/DNS  +  CDN\n   │\n外部服务    云效 DevOps  +  云短信  +  微信登录  +  Jmeter  +  Docker\n```\n\n**决策要点**：\n- 编辑端与发布页**共享同一后端服务层**，仅鉴权策略不同（编辑端需登录、发布页凭 `pageId` 免登录，见 20-2）；\n- 静态资源走 OSS + CDN，减轻应用服务器带宽；\n- 多节点部署时 Nginx 做负载均衡，Jmeter 压测结果反推带宽/内存配置（28-1、30-6 优化接口性能）。\n\n## 三、关键代码模式（带课程锚点，可直接复用）\n\n### 模式 1：Monorepo 分包与共享\n- `client`（React 编辑器）、`server`（NestJS）、`share`（公共组件 + 类型）三包；\n- `share` 以 `workspace:^` 被引用（14-6 的 `@lowcode/share`）；\n- **原则**：只在本页用的组件放 `pages/editor/`，跨页复用的才放 `components/`（14-6）。\n\n### 模式 2：NestJS 分层与装饰器\n- Module / Controller / Service / DTO / 拦截器 / 管道 / 装饰器 分层清晰；\n- **用户信息装饰器**（`@User()` 解析 token→user，11-1）全局复用；\n- **验证码装饰器封装**（11-5 第三方短信验证码发送装饰器）把横切逻辑收口；\n- 响应拦截器（Nest 的响应拦截器）、异常拦截器统一出参。\n\n### 模式 3：TypeORM 实体与关系\n- 实体定义 + 自动同步数据库（10-3）；\n- 一对一（10-6）、一对多（10-7）关系表关联与查询；\n- Mysql 事务（10-8）保证发布/提交一致性。\n\n### 模式 4：Schema 驱动渲染（平台内核，见原理综述·上）\n- 编辑端把组件（含 `type`+`props`）存为数组 Schema；\n- 发布接口按 `pageId` 捞出返回（20-2）；\n- 前端 `getComponentByType(type)` 映射组件 + 扩展运算符摊开 `props`（20-6）；\n- 输入型组件 `onChange→onUpdate` 回写 `localData`（useImmer）。\n\n### 模式 5：拖拽编辑器（dnd-kit + MobX）\n- `DndContext`(外层) + `SortableContext`(传组件 ID 数组,垂直策略) + `useSortable`(每项)；\n- `useSensors` 设 2px 激活约束、`closestCenter` 碰撞检测（18-4）；\n- **避坑**：`transform` 的 Y 轴部分需 `replace` 清空，否则拖动态样式突变；\n- 拖拽本质 = `arrayMove(oldIndex, newIndex)` 重排 store 数组。\n\n### 模式 6：OSS 上传（动态模块 + multer）\n- `AliOssModule` 用 `@Global()` 动态模块注入 `ALI_OSS` 实例（17-1）；\n- `multer` 处理 `multipart/form-data`；\n- `uploadToAliOss`：文件名 latin1→utf8、拼 `upload-files/原名-时间戳.扩展名`、put、删本地临时、正则把默认域名替换为自有 CNAME。\n\n### 模式 7：容器化与 DevOps\n- 每个运行时一个 Dockerfile：后端 Nest、后端 Nginx、Next 服务端、前端 Nginx（23-3~23-6）；\n- `docker-compose` 编排多容器（24-1/24-2）；\n- 云效流水线关联代码源 → 构建 → 推送镜像 → 服务器运行（25-1、26-x）。\n\n### 模式 8：性能压测闭环\n- Jmeter 线程组 + 取样器 + 聚合报告 + 响应断言（28-x、29-x）；\n- 对登录、获取问卷组件、提交问卷等接口压测（30-x）；\n- 据聚合报告优化（30-6 优化获取低代码组件接口性能）。\n\n## 四、Do / Don't（从踩坑篇提炼）\n\n### Do ✅\n- **样式先行、逻辑重点讲**：先把布局骨架立起来，复杂逻辑再逐行讲（14-6）；\n- **先把数据链路想清再画 UI**：发布接口 + 页面组件获取接口就绪后再搭编辑器（14-6、20-2）；\n- **接口梳理先于联调**：编辑模块后端接口先梳理（14-1）再开发；\n- **密钥用占位符 + 环境变量**：绝不硬编码（17-1、27-7）；\n- **拖拽 transform 的 Y 轴清空**：避免样式跳变（18-4）；\n- **`user?.id` 可选链兜底**：发布页接口 `user` 可能为空（20-2）；\n- **目录按\"页面专属 vs 公共复用\"划分**：避免组件到处乱放（14-6）。\n\n### Don't ❌\n- 不要硬编码 `accessKeySecret` / 数据库密码；\n- 不要把页面专属组件塞进公共 `components/`；\n- 不要给发布页误加鉴权（它本就凭 `pageId` 免登录，20-2）；\n- 不要在拖拽时漏置 `isDraggable`，否则选中态/边框错乱（18-4）；\n- 不要忽略数组越界：`over` 为 `null` 时直接 return（18-4）；\n- 不要把\"配置即所得\"误传给业务方（那是零代码范畴，见原理综述·下）。\n\n## 五、上线 Checklist（基于 27-x 自动化部署上线 + 23-x Dockerfile）\n\n- [ ] 镜像构建：后端 / 后端 Nginx / Next 服务端 / 前端 Nginx 四个 Dockerfile 校验通过\n- [ ] `docker-compose` 多容器编排正确，端口/依赖顺序无误\n- [ ] 云效流水线关联代码源，构建推送成功\n- [ ] 线上 IP + 端口、Bucket 绑定域名（27-6）配置正确\n- [ ] 编辑平台功能确认、后台数据统计功能确认（27-7）通过\n- [ ] Jmeter 压测达标，关键接口（获取组件/提交问卷）性能满足预期（30-x）\n- [ ] 密钥走环境变量/密钥库，全仓无明文\n- [ ] Nginx 反向代理 + 负载均衡配置生效\n\n## 六、商用化补齐清单（从\"能跑\"到\"可商用\"）\n\n课程是**优秀的研发侧实战样本**，但距生产级低代码平台还差以下一层（呼应原理综述）：\n\n| 维度 | 现状（课程） | 商用化补齐 |\n|------|--------------|------------|\n| Schema 协议 | 组件 `type`+`props` 直驱 | 固化**版本化 Schema 协议** + 组件市场 |\n| 逻辑能力 | props 内简单 `defaultXxx` | 引入 **DSL / 可视化逻辑编排**（条件显隐、跨页联动） |\n| 流程引擎 | 仅草稿/发布/提交状态 | 接入 **BPMN / 状态机**，与表单引擎解耦 |\n| 权限 | 编辑端登录 + 发布页免登录 | 统一 **RBAC**（角色×资源×操作）+ Guard |\n| 组件库 | 课程内置若干组件 | 可插拔**组件市场** + 第三方组件接入规范 |\n| 运维 | Docker + 云效 + Jmeter | **监控告警、日志、灰度发布、回滚** |\n| 多租户 | 单租户演示 | 租户隔离（数据/资源/配置） |\n\n> 把这七项补齐，本资产即可从\"一套课程博客\"升级为\"团队自研低代码平台的**技术底座 + 实施手册**\"。\n", "04": "# 低代码平台落地生命周期导航\n\n> 把 229 篇博客按「低代码平台落地生命周期」重新组织（而非平铺按集数）。每个阶段标注对应原期目录与关联物料数。\n> 数据源自 `graph.json`（229 节点），归类规则见脚本 `tools/gen_engineering_practice.py`。\n\n- 博客总数：**229** 篇\n- 关联物料：**81100** 个（代码 2231 / 资料 189）\n- 关联图片：**606** 张\n\n## 生命周期主线\n\n```\n需求分析 → 系统架构 → 后端接口(NestJS) → 前端框架(React)\n→ 编辑器(拖拽配置) → 发布页渲染(Schema) → 资源(OSS) → 数据统计 → 部署DevOps → 压测运维\n```\n\n| 阶段 | 篇数 | 说明 |\n|------|-----:|------|\n| 需求分析与架构 | 39 | 业务需求、需求文档、系统架构、ER 图、数据库设计、环境准备、课程导学 |\n| 数据统计后台 | 14 | 后台数据统计、Excel 导出、动态图表 |\n| 资源与存储（OSS） | 9 | 阿里云 OSS 上传/删除/获取、前端资源逻辑 |\n| 编辑器（拖拽与配置） | 35 | 编辑模块、组件展示/配置、拖拽、属性配置、工具栏、键盘操作、草稿/预览/发布 |\n| 发布页与 Schema 渲染 | 14 | 发布页面、Next.js 渲染、问卷提交、Schema 驱动渲染 |\n| 部署与 DevOps | 26 | Docker、Dockerfile、Compose、云效流水线、自动化部署上线 |\n| 性能压测（Jmeter） | 15 | Jmeter 安装、组件、接口压测、聚合报告 |\n| 后端服务（NestJS） | 50 | NestJS 接口、TypeORM、验证码、微信登录、注册登录、发布/获取接口 |\n| 前端框架（React） | 23 | React/Next.js、Ant Design、Tailwind、路由、状态管理、子项目工程化 |\n| 职业与面试 | 4 | 全栈简历编写、面试官视角、项目讲解 |\n\n## 需求分析与架构（39 篇）\n\n> 业务需求、需求文档、系统架构、ER 图、数据库设计、环境准备、课程导学\n\n| # | 标题 | 原期目录 function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,u)=>'<a class="doc" href="'+u+'">'+t+'</a>');
  return s;
}
function md2html(md){
  const lines = md.split('\n');
  let html='', i=0, inCode=false, codeBuf=[];
  const flushCode=()=>{ if(codeBuf.length){ html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>'; codeBuf=[]; } };
  while(i<lines.length){
    let line=lines[i];
    if(line.trim().startsWith('```')){ if(inCode){flushCode(); inCode=false;} else {flushCode(); inCode=true;} i++; continue; }
    if(inCode){ codeBuf.push(line); i++; continue; }
    if(/^\s*>\s?/.test(line)){ let buf=[]; while(i<lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; } html+='<blockquote>'+inline(buf.join(' '))+'</blockquote>'; continue; }
    let h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){ const lv=h[1].length; html+='<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'; i++; continue; }
    if(/^\s*\|/.test(line)){
      let rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      let table='<table>';
      rows.forEach((r,ri)=>{
        const cells=r.split('|').slice(1,-1).map(c=>c.trim());
        if(ri===1 && /^-+:?|-+:?-$/.test(cells.join('|'))) return; // 分隔行
        const tag = ri===0?'th':'td';
        table+='<tr>'+cells.map(c=>'<'+tag+'>'+inline(c)+'</'+tag+'>').join('')+'</tr>';
      });
      table+='</table>'; html+=table; continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      let buf=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ buf.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; }
      html+='<ol>'+buf.join('')+'</ol>'; continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      let buf=[]; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ buf.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++; }
      html+='<ul>'+buf.join('')+'</ul>'; continue;
    }
    if(line.trim()===''){ i++; continue; }
    html+='<p>'+inline(line)+'</p>'; i++;
  }
  flushCode();
  return html;
}

// ---- 渲染各 section ----
function renderHome(){
  return `<div class="card"><h2 class="sec">总览与定位</h2>
    <div class="kpis">
      <div class="kpi"><b>${STATS.blogs}</b><span>技术博客（篇）</span></div>
      <div class="kpi"><b>${STATS.materials}</b><span>关联物料（个）</span></div>
      <div class="kpi"><b>${STATS.images}</b><span>关联图片（张）</span></div>
      <div class="kpi"><b>${STATS.kb}</b><span>正文（KB）</span></div>
    </div>
    <p class="meta-note">本门户基于 <code>graph.json</code>（229 节点知识图谱）生成；元文档（原理/治理/手册/导航）为在 229 篇基础上叠加的方法论与治理层。<code>graph.json</code> 保持原样未改动。</p>
    <div class="md-body">${md2html(META['00'])}</div></div>`;
}
function renderLife(){
  let html='<div class="card"><h2 class="sec">生命周期导航</h2><p class="meta-note">按落地生命周期归类 229 篇；点击标题打开对应博客原文（相对路径）。</p>';
  STAGES.forEach(st=>{
    const items=NODES.filter(n=>n.life===st.id);
    if(!items.length) return;
    html+=`<div class="stage-h">${st.name} <span class="pill">${items.length} 篇</span></div>`;
    html+='<table><tr><th>#</th><th>标题</th><th>原期</th><th>物料</th><th>图</th></tr>';
    items.slice().sort((a,b)=>((a.stage||'')+(a.num||0)).localeCompare((b.stage||'')+(b.num||0))).forEach(n=>{
      html+=`<tr><td>${n.num}</td><td><a class="doc" href="${n.link}">《${esc(n.title)}》</a></td><td>${esc(n.stage)}</td><td>${n.n_materials}</td><td>${n.n_images}</td></tr>`;
    });
    html+='</table>';
  });
  html+='</div>';
  return html;
}
function renderSearch(){
  return `<div class="card"><h2 class="sec">全文检索（229 篇）</h2>
    <div class="controls">
      <input id="q" placeholder="输入关键词，如 dnd-kit / TypeORM / OSS / 发布接口 ..." />
      <select id="sf"><option value="">全部阶段</option>${STAGES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
      <button class="btn" onclick="doSearch()">检索</button>
      <button class="btn ghost" onclick="doSearch(true)">清空</button>
    </div>
    <div id="sres"></div></div>`;
}
function doSearch(clear){
  const q=(clear?'':document.getElementById('q').value.trim().toLowerCase());
  const sf=document.getElementById('sf').value;
  let res=NODES.filter(n=>(!sf||n.life===sf)&&(!q||(n.title+ (n.stage||'')).toLowerCase().includes(q)));
  let h=`<p class="meta-note">命中 ${res.length} 篇</p><table><tr><th>#</th><th>标题</th><th>阶段</th><th>物料</th></tr>`;
  res.slice().sort((a,b)=>((a.stage||'')+(a.num||0)).localeCompare((b.stage||'')+(b.num||0))).forEach(n=>{
    const sname=(STAGES.find(s=>s.id===n.life)||{}).name||n.life;
    h+=`<tr><td>${n.num}</td><td><a class="doc" href="${n.link}">《${esc(n.title)}》</a></td><td>${sname}</td><td>${n.n_materials}</td></tr>`;
  });
  h+='</table>';
  document.getElementById('sres').innerHTML=h;
}
function renderStats(){
  let html='<div class="card"><h2 class="sec">知识图谱统计</h2>';
  html+='<table><tr><th>生命周期阶段</th><th>篇数</th><th>说明</th></tr>';
  STAGES.forEach(s=>{ html+=`<tr><td>${s.name}</td><td>${s.count}</td><td>${s.desc}</td></tr>`; });
  html+='</table><p class="meta-note">数据来自 graph.json（229 节点），按生命周期归类统计。</p></div>';
  return html;
}
function renderMeta(key){ return `<div class="card"><div class="md-body">${md2html(META[key])}</div></div>`; }

const ROUTER={
  home:renderHome, life:renderLife, search:renderSearch, stats:renderStats,
  m01:()=>renderMeta('01'), m02:()=>renderMeta('02'), m03:()=>renderMeta('03'),
  m05:()=>renderMeta('05'), m04:()=>renderMeta('04')
};
function go(sec){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.sec===sec));
  document.getElementById('main').innerHTML=(ROUTER[sec]||renderHome)();
  if(sec==='search'){ document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();}); }
  window.scrollTo(0,0);
}
document.getElementById('nav').addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a)return; e.preventDefault(); go(a.dataset.sec);
});
go('home');
</script>
</body>
</html>
